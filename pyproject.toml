[project]
name = "jevling"
version = "0.1.0"
description = "Local Jev-compatible typed decisions over llama-cpp-python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "llama-cpp-python>=0.3",
]

[project.optional-dependencies]
dev = ["pyright>=1.1", "mypy>=1.0", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevling"]
